<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふーちゃんAI</title>

<style>
body{
  margin:0;
  background:#111827;
  color:white;
  font-family:sans-serif;
}

.chat{
  max-width:600px;
  margin:auto;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  padding:20px;
  font-size:24px;
  font-weight:bold;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{
  padding:12px;
  border-radius:14px;
  margin-bottom:10px;
  max-width:80%;
}

.ai{
  background:#374151;
}

.user{
  background:#2563eb;
  margin-left:auto;
}

.input-area{
  display:flex;
  padding:10px;
  gap:10px;
  background:#1f2937;
}

input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  font-size:16px;
}

button{
  border:none;
  border-radius:12px;
  padding:12px 18px;
  background:white;
}
</style>
</head>

<body>

<div class="chat">

<div class="header">
ふーちゃんAI
</div>

<div class="messages" id="messages">

<div class="msg ai">
なんじゃ？ わらわを呼んだかえ？
</div>

</div>

<div class="input-area">
<input id="input" placeholder="話しかけてみる">
<button onclick="sendMessage()">送信</button>
</div>

</div>

<script>

function sendMessage(){

const input = document.getElementById("input");
const text = input.value;

if(!text) return;

addMessage(text,"user");

let reply = "ふむ、面白いの";

if(text.includes("桜")){
  reply = "桜はよいのぉ";
}

else if(text.includes("多肉")){
  reply = "また狩るのかえ？";
}

else if(text.includes("うどん")){
  reply = "讃岐へ向かうかの？";
}

addMessage(reply,"ai");

input.value = "";

}

function addMessage(text,type){

const messages = document.getElementById("messages");

const div = document.createElement("div");

div.className = "msg " + type;

div.innerText = text;

messages.appendChild(div);

messages.scrollTop = messages.scrollHeight;

}

</script>

</body>
</html>
